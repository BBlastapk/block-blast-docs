site_name: Block Blast Docs
site_description: Community-maintained documentation for Block Blast gameplay, troubleshooting, strategy, and reference material.
site_url: https://github.com/BBlastapk/block-blast-docs/

repo_url: https://github.com/BBlastapk/block-blast-docs/
repo_name: block-blast-docs

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Gameplay:
      - Game Mechanics: game-mechanics.md
      - High Score Guide: high-score.md
      - Solver Guide: solver.md
  - Troubleshooting:
      - Installation: installation.md
      - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Resources: resources.md
  - About: about.md
