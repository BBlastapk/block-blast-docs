site_name: Block Blast Docs
site_description: Community-maintained documentation covering gameplay, puzzle strategy, troubleshooting, installation, and technical reference material for Block Blast.
site_url: https://bblastapk.github.io/block-blast-docs/

repo_name: BBlastapk/block-blast-docs
repo_url: https://github.com/BBlastapk/block-blast-docs

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md

  - Getting Started:
      - getting-started.md

  - Gameplay:
      - game-mechanics.md
      - high-score.md
      - solver.md

  - Reference:
      - Overview: reference/index.md
      - Board Management: reference/board-management.md
      - Scoring: reference/scoring.md
      - Gameplay Glossary: reference/glossary.md
      - Solver Concepts: reference/solver-concepts.md

  - Piece Library:
      - Overview: reference/pieces/index.md
      - Square: reference/pieces/square.md
      - Line: reference/pieces/line.md
      - L Shape: reference/pieces/l-shape.md
      - T Shape: reference/pieces/t-shape.md
      - Z Shape: reference/pieces/z-shape.md
      - Corner: reference/pieces/corner.md
      - Plus Shape: reference/pieces/plus-shape.md

  - Installation:
      - installation.md

  - Troubleshooting:
      - troubleshooting.md

  - FAQ:
      - faq.md

  - Resources:
      - resources.md

  - About:
      - about.md
