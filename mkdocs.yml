site_name: Block Blast Docs
site_description: Community-maintained documentation covering gameplay, puzzle strategy, troubleshooting, installation, and technical reference material for Block Blast.
site_url: https://bblastapk.github.io/block-blast-docs/

repo_name: BBlastapk/block-blast-docs
repo_url: https://github.com/BBlastapk/block-blast-docs

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true

extra:
  generator: false

copyright: >
  © 2026 Block Blast Docs

nav:
  - Home: index.md

  - Getting Started:
      - getting-started.md

  - Gameplay:
      - Game Mechanics: game-mechanics.md
      - High Score: high-score.md
      - Solver: solver.md

  - Guides:
      - Beginner Roadmap: guides/beginner-roadmap.md
      - Advanced Play: guides/advanced-play.md
      - Recovery Guide: guides/recovery-guide.md

  - Reference:
      - Overview: reference/index.md
      - Board Management: reference/board-management.md
      - Scoring: reference/scoring.md
      - Solver Concepts: reference/solver-concepts.md
      - Piece Library:
          - Overview: reference/pieces/index.md

  - Versions:
      - Overview: versions/index.md
      - Compatibility: versions/compatibility.md

  - Changelog:
      - Overview: changelog/index.md
      - Latest: changelog/latest.md

  - Glossary:
      - Glossary: glossary/index.md

  - Installation:
      - installation.md

  - Troubleshooting:
      - troubleshooting.md

  - FAQ:
      - faq.md

  - Resources:
      - resources.md

  - About:
      - about.md
